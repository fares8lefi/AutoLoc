spring.application.name=AutoLocCCE
server.port=9090
# ── Datasource MySQL ──────────────────
#URL de connexion à la BDD MySQL :
spring.datasource.url=jdbc:mysql://localhost:3306/ProjetSpring?createDatabaseIfNotExist=true
#Nom d'utilisateur MySQL
spring.datasource.username=root
#Mot de passe MySQL
spring.datasource.password=

# ── JPA / Hibernate ──────────────────
#Affiche les requêtes SQL générées en console
spring.jpa.show-sql=true
# Dev-only schema refresh: recreate tables so identity PKs are generated as AUTO_INCREMENT.
# If a stale table already exists without AUTO_INCREMENT (for example after a previous run),
# ddl-auto=update does not repair that column automatically.
spring.jpa.hibernate.ddl-auto=update